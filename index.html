<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>WCA Editor</title>
<style>
:root{
  --bg:#0b0f14; --panel:#131a22; --panel2:#1b232d; --line:#26313d;
  --fg:#e8eef4; --muted:#8ba0b3; --accent:#f5b942; --accent2:#1e88e5; --danger:#e5484d;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header .logo{font-weight:800;letter-spacing:.4px}
header .logo b{color:var(--accent)}
header .spacer{flex:1}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#0b0f14;border-color:var(--accent)}
.btn.accent{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05080b;position:relative;min-width:0}
#preview{max-height:100%;max-width:100%;background:#000;box-shadow:0 4px 30px rgba(0,0,0,.6);border-radius:6px}
.stage .hint{position:absolute;color:var(--muted);font-size:14px;text-align:center;padding:20px;pointer-events:none}
.side{width:290px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input[type=text],.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--fg);padding:8px;font-size:13px;font-family:inherit}
.field textarea{resize:vertical;min-height:52px}
.row{display:flex;gap:8px;align-items:center}
.row input[type=range]{flex:1}
.small{font-size:11px;color:var(--muted)}
/* transport + timeline */
.transport{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line)}
.play{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#0b0f14;border:none;font-size:18px;display:flex;align-items:center;justify-content:center}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:96px}
.timeline{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px 16px;user-select:none}
.track{position:relative;height:56px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.track.audio{height:38px;margin-top:8px}
.clip{position:absolute;top:0;bottom:0;left:0;right:0;background:linear-gradient(180deg,#243244,#1a2531)}
.trim{position:absolute;top:0;bottom:0;width:12px;background:var(--accent);cursor:ew-resize;display:flex;align-items:center;justify-content:center;color:#0b0f14;font-size:10px;z-index:3}
.trim.l{left:0;border-radius:8px 0 0 8px}
.trim.r{right:0;border-radius:0 8px 8px 0}
.dim{position:absolute;top:0;bottom:0;background:rgba(5,8,11,.66);z-index:2;pointer-events:none}
.playhead{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;z-index:4;pointer-events:none;box-shadow:0 0 6px rgba(255,255,255,.8)}
.wave{position:absolute;inset:0;opacity:.5}
.badge{position:absolute;left:8px;top:6px;font-size:10px;color:var(--muted);z-index:1;letter-spacing:.4px}
.empty-audio{color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;height:100%}
.overlay{position:fixed;inset:0;background:rgba(5,8,11,.82);display:none;align-items:center;justify-content:center;z-index:20}
.overlay.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 28px;text-align:center;max-width:340px}
.card .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:14px 0}
.card .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">WCA <b>Editor</b> <span class="small" style="opacity:.6">v1.2</span></div>
    <label class="btn primary" for="videoInput">＋ Video</label>
    <input id="videoInput" type="file" accept="video/*" />
    <label class="btn" for="musicInput">♪ Musik</label>
    <input id="musicInput" type="file" accept="audio/*" />
    <div class="spacer"></div>
    <button class="btn accent" id="exportBtn" disabled>⬇ Export</button>
  </header>

  <main>
    <div class="stage">
      <div class="hint" id="stageHint">Tap “＋ Video” untuk mulai.<br><span class="small">Jalan paling mulus di Chrome / Edge.</span></div>
      <canvas id="preview" width="720" height="1280"></canvas>
    </div>

    <aside class="side">
      <div>
        <h3>Teks / Caption</h3>
        <div class="field">
          <textarea id="capText" placeholder="Ketik caption di sini..."></textarea>
        </div>
        <div class="field">
          <label>Posisi</label>
          <select id="capPos">
            <option value="bottom">Bawah</option>
            <option value="center">Tengah</option>
            <option value="top">Atas</option>
          </select>
        </div>
        <div class="field">
          <label>Ukuran <span id="capSizeVal" class="small">48</span></label>
          <div class="row"><input id="capSize" type="range" min="20" max="96" value="48" /></div>
        </div>
        <div class="row">
          <div class="field" style="flex:1"><label>Warna</label><input id="capColor" type="text" value="#ffffff" /></div>
          <div class="field" style="flex:1"><label>Outline</label><input id="capOutline" type="text" value="#000000" /></div>
        </div>
      </div>

      <div>
        <h3>Watermark WCA</h3>
        <div class="row"><label class="small"><input type="checkbox" id="wmOn" checked /> Tampilkan logo di pojok</label></div>
      </div>

      <div>
        <h3>Audio</h3>
        <div class="field">
          <label>Volume musik <span id="musVolVal" class="small">80%</span></label>
          <div class="row"><input id="musVol" type="range" min="0" max="100" value="80" /></div>
        </div>
        <div class="field">
          <label>Volume asli video <span id="vidVolVal" class="small">100%</span></label>
          <div class="row"><input id="vidVol" type="range" min="0" max="100" value="100" /></div>
        </div>
      </div>

      <div class="small" id="info">Belum ada video.</div>
    </aside>
  </main>

  <div class="transport">
    <button class="play" id="playBtn">▶</button>
    <div class="time" id="timeLabel">0.0 / 0.0s</div>
    <div class="small" id="trimLabel"></div>
    <div class="spacer" style="flex:1"></div>
    <div class="small" id="audioStat" style="font-weight:600">🔈 —</div>
  </div>

  <div class="timeline">
    <div class="track" id="vtrack">
      <div class="badge">VIDEO</div>
      <div class="clip" id="clip"></div>
      <div class="dim" id="dimL"></div>
      <div class="dim" id="dimR"></div>
      <div class="trim l" id="trimL">‹</div>
      <div class="trim r" id="trimR">›</div>
      <div class="playhead" id="playhead"></div>
    </div>
    <div class="track audio" id="atrack">
      <div class="badge">MUSIK</div>
      <div class="empty-audio" id="aEmpty">— belum ada musik —</div>
    </div>
  </div>
</div>

<div class="overlay" id="expOverlay">
  <div class="card">
    <div style="font-weight:700;margin-bottom:4px">Mengekspor video…</div>
    <div class="small" id="expMsg">Merender frame demi frame.</div>
    <div class="bar"><i id="expBar"></i></div>
    <div class="small">Jangan tutup / pindah tab.</div>
  </div>
</div>

<script src="editor.js"></script>
</body>
</html>
